# Mỗi lần đẩy lên nhánh main: chạy test, dựng bản demo chạy trong trình duyệt (tools/build_web_demo.py)
# rồi đăng lên GitHub Pages. Bật một lần: Settings → Pages → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-deploy.txt pandas pytest httpx
      - run: >-
          python -m pytest -q tests/test_backend.py tests/test_videos.py tests/test_worker.py
          tests/test_smoothing.py tests/test_slot_cropper.py tests/test_classifier.py
          tests/test_yolo_detector.py tests/test_evaluate.py tests/test_web_vision.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.26,<3" opencv-python-headless
      - run: python tools/build_web_demo.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
