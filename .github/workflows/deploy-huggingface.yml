# Mỗi lần đẩy lên nhánh main: chạy test, rồi cập nhật Space trên Hugging Face (SDK Gradio, tự khởi động lại).
# Cần cấu hình trong repo GitHub (Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  – token Hugging Face quyền Write
#   variable HF_SPACE  – tên Space, ví dụ  ten-tai-khoan/smart-parking
name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-deploy.txt pandas pytest httpx
      - run: >-
          python -m pytest -q tests/test_backend.py tests/test_videos.py tests/test_worker.py
          tests/test_smoothing.py tests/test_slot_cropper.py tests/test_classifier.py
          tests/test_yolo_detector.py tests/test_evaluate.py

  deploy:
    needs: test
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.25,<1"
      - name: Gom các file Space cần (giống .dockerignore) và thẻ README của Space
        run: |
          mkdir -p /tmp/space
          rsync -a --exclude-from=deploy/huggingface/exclude.txt ./ /tmp/space/
          cp deploy/huggingface/README.md deploy/huggingface/app.py deploy/huggingface/packages.txt /tmp/space/
          cp requirements-deploy.txt /tmp/space/requirements.txt
          echo 'huggingface_hub<1.0   # Gradio 4.44 (Space SDK) needs HfFolder, removed in huggingface_hub 1.x' >> /tmp/space/requirements.txt
          du -sh /tmp/space && find /tmp/space -type f | sort
      - name: Đẩy lên Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          # xoá file cũ không còn dùng trong các thư mục của ứng dụng (giữ .gitattributes của Space)
          api.upload_folder(repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path="/tmp/space",
                            delete_patterns=["src/**", "configs/**", "models/**", "data/**", "Dockerfile"],
                            commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}")
          print("https://huggingface.co/spaces/" + os.environ["HF_SPACE"])
          EOF
